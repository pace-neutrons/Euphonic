name: Build static h5py wheels for Python 3.15 testing

on:
  push:
    paths:
      - '.github/workflows/build_h5py_wheels.yml'
  workflow_dispatch:

jobs:
  build-wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-latest
          - os: macos-15-intel

    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Python 3.15
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Build and install HDF5 statically (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

          cd $HOME
          wget https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.tar.gz
          tar xzf hdf5-1.14.6.tar.gz
          cd hdf5-1.14.6

          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/hdf5-static
          cmake --build . --parallel
          cmake --install .

          # Create stub .so files
          touch $HOME/hdf5-static/lib/libhdf5.so
          touch $HOME/hdf5-static/lib/libhdf5_hl.so

          echo "HDF5_DIR=$HOME/hdf5-static" >> $GITHUB_ENV
          echo "HDF5_INCLUDE_DIR=$HOME/hdf5-static/include" >> $GITHUB_ENV
          echo "HDF5_LIB_DIR=$HOME/hdf5-static/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/hdf5-static/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build and install HDF5 statically (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install cmake

          cd $HOME
          wget https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.tar.gz
          tar xzf hdf5-1.14.6.tar.gz
          cd hdf5-1.14.6

          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/hdf5-static
          cmake --build . --parallel
          cmake --install .

          # Create stub .dylib files
          touch $HOME/hdf5-static/lib/libhdf5.dylib
          touch $HOME/hdf5-static/lib/libhdf5_hl.dylib

          echo "HDF5_DIR=$HOME/hdf5-static" >> $GITHUB_ENV
          echo "HDF5_INCLUDE_DIR=$HOME/hdf5-static/include" >> $GITHUB_ENV
          echo "HDF5_LIB_DIR=$HOME/hdf5-static/lib" >> $GITHUB_ENV
          echo "LDFLAGS=-L$HOME/hdf5-static/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$HOME/hdf5-static/include" >> $GITHUB_ENV

      - name: Build and install HDF5 statically (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          choco install cmake -y

          $hdf5Home = $env:USERPROFILE
          $url = "https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.zip"
          $output = "$hdf5Home\hdf5-1.14.6.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath $hdf5Home

          cd $hdf5Home\hdf5-1.14.6
          mkdir build
          cd build

          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_INSTALL_PREFIX=$hdf5Home\hdf5-static `
            -G "Visual Studio 17 2022" -A x64

          cmake --build . --config Release --parallel
          cmake --install .

          # Create stub .lib files
          New-Item -Path "$hdf5Home\hdf5-static\lib\hdf5.lib" -ItemType File -Force
          New-Item -Path "$hdf5Home\hdf5-static\lib\hdf5_hl.lib" -ItemType File -Force

          "HDF5_DIR=$hdf5Home\hdf5-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HDF5_INCLUDE_DIR=$hdf5Home\hdf5-static\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HDF5_LIB_DIR=$hdf5Home\hdf5-static\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build h5py wheel
        run: |
          python -m pip install --upgrade pip wheel
          pip wheel h5py -w ./dist/ --no-cache-dir \
            --config-settings=--build-type=static \
            --config-settings=--hdf5=/opt/hdf5-static

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5py-wheel-${{ matrix.os }}
          path: dist/h5py-*.whl
          retention-days: 90
