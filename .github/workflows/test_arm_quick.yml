name: test-arm-quick
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Ensure tags are fetched for versioning
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
          allow-prereleases: true

      - name: Update pip and install dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group ci

      - name: Download pinned h5py wheel
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${{ runner.temp }}/wheels"
          gh release download ci-dependencies --pattern "h5py*.whl" --dir "${{ runner.temp }}/wheels"

      - name: Run tests
        shell: bash -l {0}
        env:
          PIP_FIND_LINKS: ${{ runner.temp }}/wheels
          PIP_PRE: "1"
        run: python -m tox run -- --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Unit test results ubuntu-24.04-arm
          path: tests_and_analysis/test/reports/junit_report*.xml
