name: Build and test Python wheels

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Target branch / tag / commit"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Target branch / tag / commit"
        required: true
        type: string

jobs:
  build-wheels:
    strategy:
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            wheelname: win
            cibw_archs: "AMD64"
          - os: macos-15-intel
            wheelname: macosx
            cibw_archs: "x86_64"
          - os: macos-latest
            wheelname: macosx
            cibw_archs: "arm64"
          - os: ubuntu-latest
            wheelname: manylinux
            cibw_archs: "x86_64"
          - os: ubuntu-24.04-arm
            wheelname: manylinux
            cibw_archs: "aarch64"
          - python-version: '3.10'
            version-tag: cp310
          - python-version: '3.11'
            version-tag: cp311
          - python-version: '3.12'
            version-tag: cp312
          - python-version: '3.13'
            version-tag: cp313
          - python-version: '3.14'
            version-tag: cp314
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install llvm on Macos
        if: startsWith(matrix.os, 'macos')
        shell: bash -l {0}
        env:
          # Homebrew location is different on Intel Mac
          LLVM_DIR: ${{ (matrix.os == 'macos-15-intel') && '/usr/local/opt/llvm' || '/opt/homebrew/opt/llvm' }}
        run: |
          brew install llvm
          echo CC="${LLVM_DIR}/bin/clang" >> $GITHUB_ENV
          echo LDFLAGS="-L${LLVM_DIR}/lib $LDFLAGS" >> $GITHUB_ENV
          echo CPPFLAGS="-I${LLVM_DIR}/include $CPPFLAGS" >> $GITHUB_ENV

      - name: Remove Strawberry ccache binary (It confuses the meson build)
        if: startsWith( inputs.os, 'windows')
        shell: powershell
        run: |
          if (Test-Path "C:\Strawberry\c\bin\ccache.exe") {
              Remove-Item "C:\Strawberry\c\bin\ccache.exe" -Force
          }

      - name: Update Python pip, build, wheel, and twine
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip build wheel twine

      - name: Troubleshooting - gather info about Euphonic version
        shell: bash -l {0}
        run: |
          git rev-parse --abbrev-ref HEAD
          git show --name-only --pretty=format:%H -s HEAD
          git describe --tags --long --dirty || true
          cat euphonic/version.py
          python -c "import euphonic; print('euphonic.version =', import('euphonic').version)"

      - name: Build wheels from git checkout
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD: ${{ matrix.version-tag }}-*
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_SKIP: "*-musllinux*"

          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

          CIBW_BEFORE_TEST: "pip install --group test"
          CIBW_TEST_EXTRAS: "brille,phonopy-reader,matplotlib"
          CIBW_TEST_COMMAND: python {package}/tests_and_analysis/test/run_tests.py

        with:
          output-dir: wheelhouse

      - name: Upload wheels as build artifacts
        uses: actions/upload-artifact@v4
        with:
            name: wheel-${{ matrix.wheelname }}-${{ matrix.python-version }}-${{ matrix.cibw_archs }}
            path: wheelhouse/*-${{ matrix.wheelname }}*_${{ matrix.cibw_archs }}.whl
            if-no-files-found: error
