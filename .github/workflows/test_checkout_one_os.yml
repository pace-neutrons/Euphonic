name: Run tests from source on one platform
on:
  workflow_call:
    inputs:
      skip:
        description: 'Skip this job'
        required: false
        default: false
        type: boolean
      os:
        description: 'Target platform'
        required: false
        default: ubuntu-latest
        type: string
      all-python-versions:
        description: 'Test all supported Python versions'
        required: false
        default: false
        type: boolean
      coverage:
        description: 'Publish coverage'
        required: false
        default: false
        type: boolean

jobs:
  test:
    if: ${{ ! inputs.skip }}
    runs-on: ${{ inputs.os }}
    env:
      MIN_MAX_PYTHON_VERSIONS: |
        3.10
        3.14
      ALL_PYTHON_VERSIONS: |
        3.10
        3.11
        3.12
        3.13
        3.14
      TOX_SKIP_ENV: ${{ inputs.all-python-versions && 'no-match' || '.*?(py311|py312|py313).*?' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Ensure tags are fetched for versioning
          fetch-tags: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.all-python-versions && env.ALL_PYTHON_VERSIONS || env.MIN_MAX_PYTHON_VERSIONS}}

      - name: Install llvm on MacOS
        if: startsWith( inputs.os , 'macos' )
        shell: bash -l {0}
        env:
          # Homebrew location is different on Intel Mac
          LLVM_DIR: ${{ ( inputs.os == 'macos-15-intel') && '/usr/local/opt/llvm' || '/opt/homebrew/opt/llvm' }}
        run: |
          brew install llvm
          echo CC="${LLVM_DIR}/bin/clang" >> $GITHUB_ENV
          echo LDFLAGS="-L${LLVM_DIR}/lib $LDFLAGS" >> $GITHUB_ENV
          echo CPPFLAGS="-I${LLVM_DIR}/include $CPPFLAGS" >> $GITHUB_ENV

      - name: Remove Strawberry ccache binary (It confuses the meson build)
        if: startsWith( inputs.os, 'windows')
        shell: powershell
        run: |
          if (Test-Path "C:\Strawberry\c\bin\ccache.exe") {
              Remove-Item "C:\Strawberry\c\bin\ccache.exe" -Force
          }

      - name: Update pip and install dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group ci

      - name: Run tests
        shell: bash -l {0}
        run: OMP_NUM_THREADS=1 python -m tox run -- ${{ inputs.coverage && '--cov' || '' }} # --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit test results ${{ inputs.os }}
          path: tests_and_analysis/test/reports/junit_report*.xml

      - name: Merge coverage reports
        if: inputs.coverage
        shell: bash -l {0}
        run: |
          dotnet tool install -g dotnet-coverage
          dotnet coverage merge --reports "tests_and_analysis/test/reports/coverage*.xml" -f cobertura -o "tests_and_analysis/test/reports/coverage-combined.xml"

      - name: Create coverage outputs
        if: inputs.coverage
        shell: bash -l {0}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.1
          reportgenerator -reports:tests_and_analysis/test/reports/coverage-combined.xml -targetdir:tests_and_analysis/test/reports/html -reporttypes:Html_Dark
          reportgenerator -reports:tests_and_analysis/test/reports/coverage-combined.xml -targetdir:tests_and_analysis/test/reports -reporttypes:Badges

      - name: Upload coverage XML
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: Coverage XML (${{ inputs.os }})
          path: tests_and_analysis/test/reports/coverage-combined.xml

      - name: Upload coverage HTML
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: Coverage HTML (${{ inputs.os }})
          path: tests_and_analysis/test/reports/html
          include-hidden-files: true

      - name: Upload coverage Badge
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: Coverage Badge (${{ inputs.os }})
          path: tests_and_analysis/test/reports/badge_shieldsio_linecoverage_lightgrey.svg
